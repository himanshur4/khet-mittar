# Local development database only. Production uses Neon (see README).
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: khetmitra-db
    environment:
      POSTGRES_USER: khetmitra
      POSTGRES_PASSWORD: khetmitra
      POSTGRES_DB: khetmitra
    ports:
      - "5432:5432"
    volumes:
      - khetmitra-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khetmitra -d khetmitra"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  khetmitra-pg:
